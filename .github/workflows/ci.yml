name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GOWORK: "off"
  CGO_ENABLED: "0"

jobs:
  test:
    name: Build + test + exact 100% coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.2"
          check-latest: true
          cache: true

      - name: go vet
        run: go vet ./...

      - name: Test with coverage
        run: go test -covermode=set -coverprofile=coverage.out ./...

      - name: Assert exact 100% statement coverage
        run: |
          go tool cover -func=coverage.out | tail -n +1 > /tmp/cov.txt
          below=$(go tool cover -func=coverage.out | awk '$3 != "100.0%"')
          if [ -n "$below" ]; then
            echo "::error::coverage below 100%"
            echo "$below"
            exit 1
          fi
          echo "all statements covered (100.0%)"

      - name: Cross-compile (6 64-bit arches + wasm, darwin, windows, the BSDs)
        run: |
          for arch in amd64 arm64 riscv64 loong64 ppc64le s390x; do
            echo "== linux/$arch =="
            GOOS=linux GOARCH=$arch go build ./...
          done
          GOOS=js      GOARCH=wasm  go build ./...
          GOOS=darwin  GOARCH=arm64 go build ./...
          GOOS=windows GOARCH=amd64 go build ./...
          # The BSDs and the Solaris family. CGO_ENABLED=0 throughout means
          # the operating system reaches this code only through the standard
          # library, so these are cheap -- and a build that is cheap and never
          # run is still worth having, because it catches a build tag before
          # somebody on that system does.
          for t in freebsd/amd64 freebsd/arm64 openbsd/amd64 openbsd/arm64 \
                   netbsd/amd64 dragonfly/amd64 illumos/amd64 solaris/amd64; do
            echo "== $t =="
            GOOS=${t%%/*} GOARCH=${t##*/} go build ./...
          done

  # Cross-compiling proves the code COMPILES for an architecture. It does not
  # prove it works there, and this package is full of the shapes where that
  # difference hides: byte-order-sensitive image sample unpacking, float->int
  # rounding, and a SIMD dependency (go-highway) whose scalar fallback is only
  # ever reached on the arches nothing tested.
  #
  # s390x matters most: it is BIG-ENDIAN. poppler and pdfium do not test there
  # either, so a green lane here is a capability neither reference has.
  arch-qemu:
    name: arch ${{ matrix.goarch }} (${{ matrix.via }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goarch: riscv64, exec: "-exec=qemu-riscv64-static", via: qemu }
          - { goarch: loong64, exec: "-exec=qemu-loongarch64-static", via: qemu }
          - { goarch: ppc64le, exec: "-exec=qemu-ppc64le-static", via: qemu }
          - { goarch: s390x,   exec: "-exec=qemu-s390x-static", via: qemu }
          # 32-bit. Nothing here had ever been built for a 32-bit target,
          # let alone run on one -- and a 32-bit `int` is where a pixel count
          # that multiplies a width by a height stops fitting. poppler runs on
          # 32-bit ARM every day; this is not exotic ground.
          # 386 runs with NO emulator: a 386 ELF executes directly on the
          # x86-64 runner. That is not a convenience, it is a correctness
          # requirement. Measured on one commit of go-gfx/gfx, eight identical
          # lanes each:
          #
          #   under qemu-i386                    5 failures out of 8
          #   under qemu-i386, asyncpreemptoff=1 0 out of 8
          #   native on the same runner          0 out of 8
          #   under qemu-arm                     0 out of 8
          #
          # Each failure landed on a DIFFERENT input although the seed is
          # fixed, and the wrong value was a sign flip rather than a rounding
          # difference. qemu-i386 loses the guest's floating-point state across
          # the signal Go delivers for asynchronous preemption. Emulating 386
          # here would buy nothing and cost a lane that goes red at random.
          - { goarch: "386",   exec: "", via: native }
          - { goarch: arm,     exec: "-exec=qemu-arm-static", via: qemu }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.2"
          check-latest: true
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y qemu-user-static
      - name: Test under qemu (${{ matrix.goarch }})
        run: GOARCH=${{ matrix.goarch }} go test ${{ matrix.exec }} ./...

  # Cross-compiling for darwin and windows is not running there. poppler and
  # pdfium are tested on both, so this is not new ground -- it is ground the
  # references hold and this repository did not: path handling, line endings and
  # file semantics are where a Linux-only suite is quietly incomplete.
  #
  # The coverage gate stays on ubuntu; these two lanes only run the tests.
  # ⛔ Building for an operating system is not running on it, and this is the
  # same argument the arch lanes make. The difference here is smaller --
  # CGO_ENABLED=0 means the OS is reached only through the standard library --
  # but "smaller" is not "none": file modes, path handling, and what a syscall
  # returns at the edges all differ, and a PDF reader opens files.
  #
  # The test binary is CROSS-BUILT ON THE HOST with the pinned toolchain and
  # then run in the virtual machine, rather than installing Go inside it. The
  # package Go a BSD ships is whatever that release froze, which would silently
  # test a different compiler from every other lane -- and this module's floor
  # is 1.27.1, so it might not build there at all.
  bsd:
    name: ${{ matrix.os }} (vm)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [freebsd, openbsd, netbsd]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.2"

      - name: Cross-build the test binary with the pinned toolchain
        env:
          CGO_ENABLED: "0"
          GOARCH: amd64
        run: GOOS=${{ matrix.os }} go test -c -o tests.bin .

      - name: Run it on FreeBSD
        if: matrix.os == 'freebsd'
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          run: ./tests.bin

      - name: Run it on OpenBSD
        if: matrix.os == 'openbsd'
        uses: vmactions/openbsd-vm@v1
        with:
          usesh: true
          run: ./tests.bin

      - name: Run it on NetBSD
        if: matrix.os == 'netbsd'
        uses: vmactions/netbsd-vm@v1
        with:
          usesh: true
          run: ./tests.bin

  os-matrix:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ⛔ ubuntu-24.04-arm is NATIVE arm64 Linux, not emulation. macOS gave
        # us arm64 already, but on Darwin: a different kernel, a different
        # libc story and a different scheduler. Most of the world that runs
        # this will be arm64 Linux -- a server, a Raspberry Pi, a CI runner --
        # and that was the one arm64 nothing executed.
        os: [macos-latest, windows-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.2"
      - run: go test ./...
